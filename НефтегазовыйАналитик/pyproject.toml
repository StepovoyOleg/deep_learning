[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-gas-analyst"
version = "0.1.0"
description = "Source-grounded oil and gas market analyst"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2.0", "openai>=1.40", "pydantic>=2.7", "pydantic-settings>=2.3",
  "qdrant-client>=1.10", "sentence-transformers>=3.0", "rank-bm25>=0.2.2",
  "pypdf>=4.2", "tavily-python>=0.5", "statsmodels>=0.14", "pandas>=2.2",
  "streamlit>=1.36", "numpy>=1.26", "xlrd>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
